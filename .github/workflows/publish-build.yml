# Shared by APK build workflows; never publishes pull-request artifacts.
name: Publish APK build

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Artifacts from this run to attach to the release
        required: true
        type: string
      build-kind:
        description: ci for isolated test-key builds, release for production-key builds
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download verified APK artifacts from this run
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes and checksums
        env:
          BUILD_KIND: ${{ inputs.build-kind }}
        run: python3 scripts/prepare-build-release.py release-assets build-release-notes.md

      # Keep the release private until all assets have been uploaded successfully.
      - name: Upload APKs to draft pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Clint Browser — ${{ github.workflow }} #${{ github.run_number }} (attempt ${{ github.run_attempt }})"
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: build-release-notes.md
          files: |
            release-assets/**/*.apk
            release-assets/SHA256SUMS.txt

      - name: Publish completed pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
