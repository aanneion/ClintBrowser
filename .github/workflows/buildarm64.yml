name: Build Clint Browser ARM64

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper JAR
        id: cache-wrapper-jar
        uses: actions/cache@v5
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-jar-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Provision Gradle Wrapper JAR
        if: steps.cache-wrapper-jar.outputs.cache-hit != 'true'
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          curl -fL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist
          "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore
        run: |
          printf '%s' "${{ secrets.BASE_64_SIGNING_KEY }}" | tr -d '\n' | base64 -d > app/release_keystore.jks

      - name: Create local.properties
        run: printf '%s\n' "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

      - name: Build GitHub Release APKs
        run: ./gradlew assembleGithubRelease

      - name: Verify APK signatures and alignment
        run: bash scripts/verify-apks.sh app/build/outputs/apk/github/release

      - name: List generated APKs
        run: find app/build/outputs/apk/github/release -name "*.apk" | sort

      - name: Select APK to Upload
        id: select_apk
        run: |
          OUT_DIR="app/build/outputs/apk/github/release"
          APK_PATH="$(find "$OUT_DIR" -maxdepth 1 -name '*arm64-v8a*.apk' | sort | head -n 1)"
          ARTIFACT_NAME="Clint-arm64-v8a"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find "$OUT_DIR" -maxdepth 1 -name '*universal*.apk' | sort | head -n 1)"
            ARTIFACT_NAME="Clint-Universal"
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$OUT_DIR/app-github-release.apk"
            ARTIFACT_NAME="Clint-Universal"
            [ -f "$APK_PATH" ] || APK_PATH=""
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in $OUT_DIR"
            ls -la "$OUT_DIR" || true
            exit 1
          fi
          echo "Selected $APK_PATH for artifact $ARTIFACT_NAME"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.select_apk.outputs.artifact_name }}
          path: ${{ steps.select_apk.outputs.apk_path }}
          if-no-files-found: error

  publish:
    name: Publish build pre-release
    needs: build
    # PRs (including same-repository PRs) remain read-only and artifact-only.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-build.yml
    with:
      artifact-pattern: 'Clint-*'
      build-kind: release
