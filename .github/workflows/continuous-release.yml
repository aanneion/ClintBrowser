# Continuous CI builds of the release APKs.
#
# Builds the GitHub and FOSS release APKs for every push to main and every
# pull request, and uploads them as workflow artifacts so they can be
# downloaded and installed for testing. This workflow validates the build
# only — it does not create GitHub Releases (see release.yml, which publishes
# tagged releases).

name: Continuous Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: continuous-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper JAR
        id: cache-wrapper-jar
        uses: actions/cache@v5
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-jar-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Provision Gradle Wrapper JAR
        if: steps.cache-wrapper-jar.outputs.cache-hit != 'true'
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          curl -fL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist
          "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      # Secrets are unavailable on pull requests from forks, so signing is
      # skipped when the keystore secret is absent and the build falls back
      # to unsigned APKs.
      - name: Decode Signing Keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          if [ -n "$BASE_64_SIGNING_KEY" ]; then
            printf '%s' "$BASE_64_SIGNING_KEY" | tr -d '\n' | base64 -d > app/release_keystore.jks
          else
            echo "No signing keystore secret available; building unsigned APKs."
          fi

      - name: Create local.properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: printf '%s\n' "$LOCAL_PROPERTIES" > local.properties

      - name: Build GitHub and FOSS Release APKs
        run: ./gradlew assembleGithubRelease assembleFossRelease

      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk" | sort

      - name: Upload GitHub APKs
        uses: actions/upload-artifact@v7
        with:
          name: Clint-github
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      - name: Upload FOSS APKs
        uses: actions/upload-artifact@v7
        with:
          name: Clint-foss
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
