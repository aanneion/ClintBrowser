# Continuous CI builds of the release APKs.
#
# Builds the GitHub and FOSS release APKs for every push to main and every
# pull request, and uploads them as workflow artifacts so they can be
# downloaded and installed for testing. These are debug-key-signed, optimized
# release builds with a separate .ci application ID, not production updates.
# No release signing secrets are exposed to pull-request builds. Tagged
# production releases are built by release.yml. Successful non-PR runs also
# publish their APKs as a uniquely tagged GitHub pre-release.

name: Continuous Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: continuous-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Test APK verification and release tooling
        run: python3 -m unittest discover -s tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper JAR
        id: cache-wrapper-jar
        uses: actions/cache@v5
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-jar-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Provision Gradle Wrapper JAR
        if: steps.cache-wrapper-jar.outputs.cache-hit != 'true'
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          curl -fL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist
          "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Build installable GitHub and FOSS CI APKs
        run: ./gradlew assembleGithubRelease assembleFossRelease -PciBuild=true

      - name: Verify APK signatures and alignment
        run: bash scripts/verify-apks.sh app/build/outputs/apk/github/release app/build/outputs/apk/foss/release

      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk" | sort

      - name: Upload GitHub APKs
        uses: actions/upload-artifact@v7
        with:
          name: Clint-github
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      - name: Upload FOSS APKs
        uses: actions/upload-artifact@v7
        with:
          name: Clint-foss
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

  publish:
    name: Publish build pre-release
    needs: build
    # PRs (including same-repository PRs) remain read-only and artifact-only.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-build.yml
    with:
      artifact-pattern: 'Clint-*'
      build-kind: ci
